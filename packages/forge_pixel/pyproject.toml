[project]
name = "forge-pixel"
version = "0.1.0"
description = "Asset Forge Pixel: estúdio de pixel art determinístico (canvas/pivô/área segura exatos, paleta travada, contorno automático e validadores)"
requires-python = ">=3.12"
dependencies = ["forge-core", "numpy>=2.0", "pillow>=10"]

[project.entry-points."forge.modalities"]
pixel = "forge_pixel:modality"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_pixel"]
