[project]
name = "forge-vfx"
version = "0.1.0"
description = "Asset Forge VFX: shaders portáveis (GLSL/Godot/Unity/HLSL) e sistemas de partículas"
requires-python = ">=3.12"
dependencies = ["forge-core", "forge-2d", "numpy>=2.0", "pillow>=10", "moderngl>=5.10"]

[project.entry-points."forge.modalities"]
vfx = "forge_vfx:modality"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_vfx"]
