[project]
name = "forge-core"
version = "0.1.0"
description = "Núcleo do Asset Forge: projetos, assets, jobs, ComfyUI, API, MCP e CLI"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6",
    "httpx>=0.27",
    "websockets>=13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "mcp>=2.2,<3",
    "pillow>=10",
    "anthropic>=1.11",
]

[project.scripts]
forge = "forge_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_core"]
