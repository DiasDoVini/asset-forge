[project]
name = "forge-video"
version = "0.1.0"
description = "Asset Forge Vídeo: text/image → vídeo (Wan 2.2), estender, regenerar trechos, editor com marcações"
requires-python = ">=3.12"
dependencies = ["forge-core", "forge-2d", "numpy>=2.0", "pillow>=10"]

[project.entry-points."forge.modalities"]
video = "forge_video:modality"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_video"]
