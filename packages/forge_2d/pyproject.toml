[project]
name = "forge-2d"
version = "0.1.0"
description = "Asset Forge 2D: text→2D, image→2D, edição, enhancement e pixelizer"
requires-python = ">=3.12"
dependencies = ["forge-core", "numpy>=2.0", "pillow>=10", "scipy>=1.11"]

[project.entry-points."forge.modalities"]
2d = "forge_2d:modality"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_2d"]
