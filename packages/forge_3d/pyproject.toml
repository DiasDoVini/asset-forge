[project]
name = "forge-3d"
version = "0.1.0"
description = "Asset Forge 3D modality: mesh generation, processing and print preparation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "forge-core",
    "forge-2d",
    "numpy>=2.0",
    "scipy>=1.13",
    "trimesh>=4.5",
    "pymeshlab>=2023.12.post3",
    "manifold3d>=3.0",
    "networkx>=3.3",
    "lxml>=5.0",
    "pydantic>=2.8",
    "pillow>=10.4",
    "rtree>=1.3",
    "scikit-image>=0.24",
    "shapely>=2.0",
    "anthropic>=0.70",
    "imageio-ffmpeg>=0.5",
    "xatlas>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."forge.modalities"]
3d = "forge_3d:modality"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
