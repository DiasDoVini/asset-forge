[project]
name = "forge-audio"
version = "0.1.0"
description = "Asset Forge Áudio: SFX, música, ambiências, sons retrô (sfxr), edição e mixagem"
requires-python = ">=3.12"
dependencies = ["forge-core", "numpy>=2.0", "pillow>=10", "scipy>=1.13", "soundfile>=0.12"]

[project.entry-points."forge.modalities"]
audio = "forge_audio:modality"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_audio"]
